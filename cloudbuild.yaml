steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE: 'northamerica-northeast1-docker.pkg.dev/foodie-503510/cloud-run-source-deploy/hockey:${SHORT_SHA}'
  _SERVICE_NAME: 'hockey'
  _REGION: 'northamerica-northeast1'
